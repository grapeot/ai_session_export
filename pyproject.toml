[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-session-export"
version = "0.1.0"
description = "Export AI coding session transcripts from multiple tools into a unified Markdown archive."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.setuptools]
packages = ["ai_session_export", "ai_session_export.sources"]

[tool.setuptools.package-dir]
"ai_session_export" = "src/ai_session_export"

[tool.pytest.ini_options]
markers = [
    "integration: self-contained multi-source integration tests",
    "live_e2e: end-to-end tests against real local data (set AI_SESSION_EXPORT_LIVE=1)",
]
